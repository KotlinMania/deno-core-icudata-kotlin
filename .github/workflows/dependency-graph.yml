name: "Refresh Dependency Graph"

# Manual-only. Submits a fresh Gradle dependency snapshot to GitHub via the
# Dependency Submission API. The submitted snapshot supersedes prior graph
# entries under the same correlator, letting Dependabot re-evaluate alerts
# against the actual current build instead of historical residue.
#
# Why this exists: at some point in this repo's history the dependency graph
# accumulated transitive entries (netty, bouncycastle, jose4j, jdom2,
# httpclient, commons-lang3, opentelemetry-api, grpc-netty) that the current
# build does not pull in (verified against `./gradlew buildEnvironment` and
# the canonical http-kotlin / anstyle-kotlin settings.gradle.kts which have
# identical content and zero alerts). The stale entries fired ~30 Dependabot
# alerts. Running this workflow once replaces the stale snapshot with an
# accurate one.
#
# Trigger: workflow_dispatch only — consistent with the workspace's
# manual-only CI policy (no push / pull_request / schedule).
#
# Action versions match the rest of this repo's workflow surface
# (actions/checkout@v6, actions/setup-java@v5.2.0,
# gradle/actions/setup-gradle@v6.1.0) so the KotlinMania allowlist accepts
# the dispatch. The dependency-graph submission rides on setup-gradle's
# `dependency-graph: generate-and-submit` parameter — no separate
# `gradle/actions/dependency-submission` action is needed (and not on the
# allowlist).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: "Submit Gradle dependency graph"
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5.2.0
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Gradle (and arm dependency-graph submission)
        uses: gradle/actions/setup-gradle@v6.1.0
        with:
          dependency-graph: generate-and-submit

      - name: Resolve dependencies to populate the snapshot
        run: ./gradlew setupAndroidSdk dependencies --no-configuration-cache
